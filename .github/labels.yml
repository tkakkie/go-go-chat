# Applied with: gh label create ... (see docs/process/workflow.md). Kept here so
# the label set is versioned.
- name: "risk:high"
  color: "b60205"
  description: "Auth, authorisation, migrations, sessions, upload, tenant boundary. Jules review required."
- name: "risk:medium"
  color: "d93f0b"
  description: "API, realtime, data model. Claude + Copilot review."
- name: "risk:low"
  color: "fbca04"
  description: "Docs, cosmetics, refactors."
- name: "type:feature"
  color: "0e8a16"
  description: "A change in behaviour."
- name: "type:bug"
  color: "ee0701"
  description: "Behaviour differs from what is specified."
- name: "type:chore"
  color: "c5def5"
  description: "Tooling, CI, dependencies, housekeeping."
- name: "type:docs"
  color: "c5def5"
  description: "Documentation only."
- name: "status:needs-approval"
  color: "bfdadc"
  description: "Waiting for a human to approve the issue (Definition of Ready)."
- name: "status:approved"
  color: "0052cc"
  description: "Issue approved; a plan may be written."
- name: "status:plan-approved"
  color: "5319e7"
  description: "Plan approved; implementation may start."
- name: "size:S"
  color: "ededed"
  description: "Small diff (signal of review effort, not a rule)."
- name: "size:M"
  color: "ededed"
  description: "Medium diff."
- name: "size:L"
  color: "ededed"
  description: "Large diff. Pull request must say where to read first."
