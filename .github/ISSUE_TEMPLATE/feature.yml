name: Feature
description: A change in behaviour. Must satisfy the Definition of Ready before it is approved.
labels: ["type:feature", "status:needs-approval"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, for whom, and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What this issue covers and, just as important, what it deliberately does not.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. Prefer Given / When / Then.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Which layers get tests (unit, integration, contract, e2e) and what each proves.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Add the matching `risk:*` label. High = auth, authorisation, migrations, sessions, upload, tenant boundary.
      options: ["low", "medium", "high"]
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Related decisions and invariants
      description: ADRs and invariant ids this touches, or "none".
